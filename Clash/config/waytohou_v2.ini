[custom]
; waytohou v2：给 Surge 用（sg3 上 subconverter 的 surge.ini 引用本文件）
; 分组和规则与 Clash Verge 的 Clash/clash-verge/Script.js 保持一致，改一边记得同步另一边。
; 规则主体是 MetaCubeX/meta-rules-dat（每日从 v2fly 同步），由 subconverter 的 getruleset 转成 Surge 格式。
; 和 Clash 版的区别：不用 geosite:cn（11 万条，手机上太重），国内流量靠最后的 GEOIP,CN；IP 规则集放在最后，避免提前触发 DNS。

; ---------- 个人补充（排在规则集前面）----------
ruleset=🚀 默认代理,[]DOMAIN-SUFFIX,waytohou.xyz
ruleset=🚀 默认代理,[]DOMAIN-SUFFIX,waytohou.eu.org
; Claude 需要 segment；广告规则集会拦截它
ruleset=🤖 AI,[]DOMAIN-SUFFIX,segment.io
ruleset=🤖 AI,[]DOMAIN-SUFFIX,segment.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,download.todesktop.com
; DeFi 前端会连的第三方服务（RPC、入金组件、钱包登录），跟着 Crypto 走
ruleset=🔐 Crypto,[]DOMAIN-SUFFIX,quiknode.pro
ruleset=🔐 Crypto,[]DOMAIN-SUFFIX,fun.xyz
ruleset=🔐 Crypto,[]DOMAIN-SUFFIX,privy.io
ruleset=🔐 Crypto,[]DOMAIN-SUFFIX,alchemy.com
ruleset=🔐 Crypto,[]DOMAIN-SUFFIX,reth.rs
; Lighter 用的钱包登录（Dynamic）和地区合规检测（sunbreak），漏掉会被判成美国 IP
ruleset=🔐 Crypto,[]DOMAIN-SUFFIX,dynamicauth.com
ruleset=🔐 Crypto,[]DOMAIN-SUFFIX,dynamic-static-assets.com
ruleset=🔐 Crypto,[]DOMAIN-SUFFIX,dynamic.xyz
ruleset=🔐 Crypto,[]DOMAIN-SUFFIX,sunbreak.com
ruleset=🧩 Polymarket,[]DOMAIN-SUFFIX,polymarket.com
ruleset=🧩 Polymarket,[]DOMAIN-SUFFIX,polymarketcdn.com
ruleset=🚀 默认代理,[]DOMAIN-SUFFIX,mypikpak.com
ruleset=🚀 默认代理,[]DOMAIN-SUFFIX,misakaf.org

; ---------- 规则集 ----------
ruleset=DIRECT,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.yaml,86400
ruleset=🛑 广告拦截,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads-all.yaml,86400
ruleset=🔐 Crypto,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-cryptocurrency.yaml,86400
ruleset=💰 Broker,https://raw.githubusercontent.com/Arthur-vx/broker-rules/refs/heads/main/rule/Surge/Broker/Broker.list,86400
ruleset=🤖 AI,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ai-!cn.yaml,86400
ruleset=📲 Telegram,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/telegram.yaml,86400
ruleset=📹 YouTube,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/youtube.yaml,86400
ruleset=🎬 流媒体,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/netflix.yaml,86400
ruleset=🎬 流媒体,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/disney.yaml,86400
ruleset=🎬 流媒体,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/spotify.yaml,86400
ruleset=📢 Google,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/google.yaml,86400
; microsoft 规则集包含 github，先截住
ruleset=🚀 默认代理,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/github.yaml,86400
ruleset=Ⓜ️ 微软,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/microsoft.yaml,86400
ruleset=🍎 苹果,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/apple.yaml,86400
ruleset=🎮 游戏,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/steam.yaml,86400
ruleset=⚡️ 测速,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/speedtest.yaml,86400
ruleset=🚀 默认代理,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/geolocation-!cn.yaml,86400
; IP 规则放最后
ruleset=DIRECT,clash-ipcidr:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/private.yaml,86400
ruleset=📲 Telegram,clash-ipcidr:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/telegram.yaml,86400
ruleset=DIRECT,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL

; ---------- 策略组 ----------
custom_proxy_group=🚀 默认代理`select`[]☃︎ 自建优选`[]🇰🇷 韩国`[]🇯🇵 日本`[]🇭🇰 香港`[]🇸🇬 新加坡`[]🇹🇼 台湾`[]🇺🇸 美国`[]🎯 手动选节点`[]DIRECT
; 自建节点按优先级故障转移，只在当前节点不通时才换，出口 IP 稳定
; kr1、kr2 不进这里（不想默认经它们出去）；每台的 VLESS Reality（TCP）紧跟在它的 Hysteria2 后面，蜂窝网把 UDP 卡住时自动退到 TCP
; Surge 的 VLESS 要 iOS 6.0.0+ / Mac 6.12.0+
custom_proxy_group=☃︎ 自建优选`fallback`(sjarm\.waytohou)`(sjarm-reality)`(sg3\.waytohou)`(sg3-reality)`(sj\.waytohou)`(sj-reality)`(gia\.waytohou)`(gia-reality)`http://www.gstatic.com/generate_204`300
custom_proxy_group=🎯 手动选节点`select`(waytohou|reality)`.*
; AI 要固定的美国 IP：直接列美国自建节点
custom_proxy_group=🤖 AI`select`(sjarm\.waytohou)`(sjarm-reality)`(sj\.waytohou)`(sj-reality)`(gia\.waytohou)`(gia-reality)`[]🇺🇸 美国`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇰🇷 韩国`[]🚀 默认代理`[]🎯 手动选节点
; 交易所 / DeFi 要固定的非美国 IP；地区组会自动切 IP，想固定机场节点就在「手动选节点」里选
custom_proxy_group=🔐 Crypto`select`(kr2\.waytohou)`(kr2-reality)`(kr1\.waytohou)`(kr1-reality)`(sg3\.waytohou)`(sg3-reality)`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇭🇰 香港`[]🇹🇼 台湾`[]🎯 手动选节点`[]DIRECT
custom_proxy_group=🧩 Polymarket`select`[]🔐 Crypto`(kr2\.waytohou)`(kr2-reality)`(kr1\.waytohou)`(kr1-reality)`(sg3\.waytohou)`(sg3-reality)`[]🇯🇵 日本`[]🇭🇰 香港`[]🇹🇼 台湾`[]🎯 手动选节点
custom_proxy_group=💰 Broker`select`[]🚀 默认代理`[]🇰🇷 韩国`[]🇯🇵 日本`[]🇭🇰 香港`[]🇸🇬 新加坡`[]🇹🇼 台湾`[]🇺🇸 美国`[]🎯 手动选节点`[]DIRECT
custom_proxy_group=📲 Telegram`select`[]🚀 默认代理`[]🇰🇷 韩国`[]🇯🇵 日本`[]🇭🇰 香港`[]🇸🇬 新加坡`[]🇹🇼 台湾`[]🇺🇸 美国`[]🎯 手动选节点
custom_proxy_group=📹 YouTube`select`[]🚀 默认代理`[]🇰🇷 韩国`[]🇯🇵 日本`[]🇭🇰 香港`[]🇸🇬 新加坡`[]🇹🇼 台湾`[]🇺🇸 美国`[]🎯 手动选节点
custom_proxy_group=🎬 流媒体`select`[]🚀 默认代理`(sg3\.waytohou)`(sg3-reality)`(gia\.waytohou)`(gia-reality)`[]🇰🇷 韩国`[]🇯🇵 日本`[]🇭🇰 香港`[]🇸🇬 新加坡`[]🇹🇼 台湾`[]🇺🇸 美国`[]🎯 手动选节点
custom_proxy_group=📢 Google`select`[]🚀 默认代理`[]🇰🇷 韩国`[]🇯🇵 日本`[]🇭🇰 香港`[]🇸🇬 新加坡`[]🇹🇼 台湾`[]🇺🇸 美国`[]🎯 手动选节点
custom_proxy_group=Ⓜ️ 微软`select`[]DIRECT`[]🚀 默认代理`[]🇰🇷 韩国`[]🇯🇵 日本`[]🇭🇰 香港`[]🇸🇬 新加坡`[]🇹🇼 台湾`[]🇺🇸 美国`[]🎯 手动选节点
custom_proxy_group=🍎 苹果`select`[]DIRECT`[]🚀 默认代理`[]🇰🇷 韩国`[]🇯🇵 日本`[]🇭🇰 香港`[]🇸🇬 新加坡`[]🇹🇼 台湾`[]🇺🇸 美国`[]🎯 手动选节点
custom_proxy_group=🎮 游戏`select`[]DIRECT`[]🚀 默认代理`[]🇰🇷 韩国`[]🇯🇵 日本`[]🇭🇰 香港`[]🇸🇬 新加坡`[]🇹🇼 台湾`[]🇺🇸 美国`[]🎯 手动选节点
custom_proxy_group=⚡️ 测速`select`[]DIRECT`[]🚀 默认代理`[]🇰🇷 韩国`[]🇯🇵 日本`[]🇭🇰 香港`[]🇸🇬 新加坡`[]🇹🇼 台湾`[]🇺🇸 美国`[]🎯 手动选节点
custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 默认代理`[]DIRECT`[]🇰🇷 韩国`[]🇯🇵 日本`[]🇭🇰 香港`[]🇸🇬 新加坡`[]🇹🇼 台湾`[]🇺🇸 美国`[]🎯 手动选节点
; 地区测速组；gia、sj 带宽只有约 50M，不进测速组
custom_proxy_group=🇰🇷 韩国`url-test`(韩国|韓|Korea|kr\d\.|kr\d-reality)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇯🇵 日本`url-test`(日本|Japan|JP)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇭🇰 香港`url-test`(香港|Hong ?Kong|HK)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇸🇬 新加坡`url-test`(新加坡|狮城|Singapore|sg\d\.|sg\d-reality)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇹🇼 台湾`url-test`(台湾|台灣|Taiwan|TW)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇺🇸 美国`url-test`^(?!.*(gia|sj\.|sj-)).*(美国|United States|sjarm)`http://www.gstatic.com/generate_204`300,,50

enable_rule_generator=true
overwrite_original_rules=true
